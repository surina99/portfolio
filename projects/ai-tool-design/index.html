<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="project-nav">
      <a class="back-link" href="../../index.html#work" aria-label="Back to work">
        <img class="back-icon back-icon-dark" src="./assets/icon-back-black.png" alt="" />
        <img class="back-icon back-icon-light" src="./assets/icon-back-white.png" alt="" />
      </a>
      <span>Lost in Paper</span>
      <nav aria-label="Project section navigation">
        <a href="#cover" aria-label="Go to cover"></a>
        <a href="#background-long-dry" aria-label="Go to long and dry background"></a>
        <a href="#background-no-time" aria-label="Go to no time background"></a>
        <a href="#painpoint-prompt" aria-label="Go to prompt editing painpoint"></a>
        <a href="#painpoint-patterns" aria-label="Go to behavior patterns painpoint"></a>
        <a href="#design-goal" aria-label="Go to design goal"></a>
        <a href="#upload-prototype" aria-label="Go to upload prototype"></a>
        <a href="#structured-controls" aria-label="Go to structured controls solution"></a>
        <a href="#reference-selection" aria-label="Go to reference selection solution"></a>
        <a href="#paper-highlight" aria-label="Go to paper highlight solution"></a>
        <a href="#architecture-flow" aria-label="Go to architecture flow solution"></a>
        <a href="#ai-workflow" aria-label="Go to AI workflow"></a>
        <a href="#ai-workflow-mockup" aria-label="Go to AI workflow mockup"></a>
        <a href="#prototype-link" aria-label="Go to prototype link"></a>
      </nav>
    </header>

    <main class="project-story" aria-label="Lost in Paper project case study preview">
      <section id="cover" class="story-section cover" data-slide>
        <img class="cover-bg" src="./assets/figma-cover-bg.png" alt="Lost in Paper title and paper-texture background." />
        <img class="cover-person" src="./assets/figma-cover-person.png" alt="" data-motion="zoom" />
        <img class="cover-caption" src="./assets/figma-cover-caption.png" alt="An AI-Powered Paper Understanding Tool" data-motion="rise" />
      </section>

      <section id="background-long-dry" class="story-section long-dry" data-slide>
        <p class="kicker" data-motion="fade">#Background</p>
        <div class="slide-stage">
          <div class="quote-stack" data-motion="rise">
            <p>When a student reads paper,<br />he/she usually feels</p>
            <img src="./assets/figma-long-dry.png" alt="" />
          </div>
          <img class="word-image long" src="./assets/figma-long-word.png" alt="LONG" data-motion="slide-left" />
          <img class="word-image dry" src="./assets/figma-dry-word.png" alt="DRY" data-motion="slide-right" />
        </div>
      </section>

      <section id="background-no-time" class="story-section no-time" data-slide>
        <p class="kicker" data-motion="fade">#Background</p>
        <div class="slide-stage">
          <img class="no-time-group" src="./assets/figma-no-time-group.png" alt="And it often happens at last minute when they basically have no time." data-motion="zoom" />
        </div>
      </section>

      <section id="painpoint-prompt" class="story-section prompt-pain" data-slide>
        <p class="kicker" data-motion="fade">#Painpoint</p>
        <div class="slide-stage">
          <img class="prompt-copy-image" src="./assets/figma-prompt-copy.png" alt="So they use AI to extract main ideas but AI has issues such as repeatedly editing prompt in input box." data-motion="rise" />
          <img class="prompt-screen-image" src="./assets/figma-prompt-box.png" alt="An interface screenshot showing a prompt input workflow." data-motion="screen" />
        </div>
      </section>

      <section id="painpoint-patterns" class="story-section patterns" data-slide>
        <p class="kicker" data-motion="fade">#Painpoint</p>
        <div class="slide-stage">
          <img class="pattern-copy-image" src="./assets/figma-pattern-copy.png" alt="And their behavior usually follow patterns as prompt examples." data-motion="rise" />
          <img class="pattern-screen-image" src="./assets/figma-patterns.png" alt="A collection of repeated prompt patterns around an AI assistant." data-motion="screen" />
        </div>
      </section>

      <section id="design-goal" class="story-section design-goal" data-slide>
        <p class="kicker" data-motion="fade">#Design Goal</p>
        <div class="slide-stage">
          <img class="goal-pattern-image" src="./assets/figma-goal-patterns.png" alt="" data-motion="screen" />
          <img class="goal-arrow-image" src="./assets/figma-goal-arrow.png" alt="" data-motion="fade" />
          <img class="goal-title-image" src="./assets/figma-goal-title.png" alt="To Reduce Repetitive Input Effort" data-motion="rise" />
        </div>
      </section>

      <section id="upload-prototype" class="story-section upload-prototype" data-slide>
        <p class="kicker" data-motion="fade">#Design Solution</p>
        <div class="slide-stage">
          <img class="upload-panel-image" src="./assets/figma-upload-panel.png" alt="Upload your paper interface mockup." data-motion="screen" />
        </div>
      </section>

      <section id="structured-controls" class="story-section structured-controls" data-slide>
        <p class="kicker" data-motion="fade">#Design Solution</p>
        <img class="prompt-chips-image" src="./assets/figma-prompt-chips.png" alt="Examples of repetitive prompt inputs." data-motion="rise" />
        <img class="structured-controls-image" src="./assets/figma-structured-controls.png" alt="Structured UI controls for adjusting generated text." data-motion="screen" />
      </section>

      <section id="reference-selection" class="story-section reference-selection" data-slide>
        <p class="kicker" data-motion="fade">#Design Solution</p>
        <img class="reference-controls-image" src="./assets/figma-reference-controls.png" alt="A design solution screen showing selectable references and regeneration controls." data-motion="screen" />
      </section>

      <section id="paper-highlight" class="story-section paper-highlight" data-slide>
        <p class="kicker" data-motion="fade">#Design Solution</p>
        <img class="paper-highlight-image" src="./assets/figma-paper-highlight.png" alt="A design solution screen showing source PDF highlights and regeneration controls." data-motion="screen" />
      </section>

      <section id="architecture-flow" class="story-section architecture-flow" data-slide>
        <p class="kicker" data-motion="fade">#Development</p>
        <img class="architecture-flow-image" src="./assets/figma-architecture-flow.png" alt="A sequence diagram and frontend contribution summary for the AI tool." data-motion="screen" />
      </section>

      <section id="ai-workflow" class="story-section ai-workflow" data-slide>
        <p class="kicker" data-motion="fade">#ai workflow</p>
        <img class="ai-workflow-image" src="./assets/figma-ai-workflow-loop.png" alt="AI-assisted workflow loop from prompts through Codex and Figma MCP." data-motion="screen" />
      </section>

      <section id="ai-workflow-mockup" class="story-section ai-workflow-mockup" data-slide>
        <p class="kicker" data-motion="fade">#ai workflow</p>
        <img class="ai-workflow-mockup-image" src="./assets/figma-ai-workflow-mockup.png" alt="AI workflow showing design brief, wireframe, UX instruction, and generated mockup." data-motion="screen" />
      </section>

      <section id="prototype-link" class="story-section prototype-link" data-slide>
        <p class="kicker" data-motion="fade">#Prototype</p>
        <div class="prototype-link-copy" data-motion="rise">
          <a href="https://lostinpaper.onrender.com/" target="_blank" rel="noopener noreferrer">Try Here 🔗</a>
          <p>it might take a minute to render</p>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
